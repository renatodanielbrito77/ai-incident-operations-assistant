services:
  mock-services:
    build: ./mock-services
    ports:
      - "127.0.0.1:8001:8000"

  ai-app:
    build: ./ai-app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MOCK_SERVICES_URL: "http://mock-services:8000"
      QDRANT_URL: "http://vector-db:6333"
    depends_on:
      - mock-services
      - vector-db

  vector-db:
    image: qdrant/qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  qdrant-data:
